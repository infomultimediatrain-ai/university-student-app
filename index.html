<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Student App — Университет порталы</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & VARIABLES
============================================================ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #818cf8;
  --primary-soft: #eef2ff;
  --accent: #06b6d4;
  --pink: #ec4899;
  --success: #10b981;
  --success-soft: #d1fae5;
  --danger: #ef4444;
  --warning: #f59e0b;
  --warning-soft: #fef3c7;
  --dark: #0f172a;
  --gray: #64748b;
  --gray-light: #94a3b8;
  --light: #f1f5f9;
  --white: #ffffff;
  --border: #e2e8f0;
  --bg: #f5f7fb;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.15);
  --radius: 14px;
  --radius-lg: 22px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--dark);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
}

button, input, select { font-family: inherit; font-size: 16px; }
a { text-decoration: none; color: inherit; }
input:focus { outline: none; }

/* ============================================================
   LOGIN
============================================================ */
#loginView {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #ec4899 100%);
}

.bg-shapes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.shape {
  position: absolute; border-radius: 50%;
  filter: blur(70px); opacity: 0.55;
}
.shape-1 { width: 380px; height: 380px; background: #a78bfa;
  top: -140px; left: -140px; animation: float1 12s ease-in-out infinite; }
.shape-2 { width: 300px; height: 300px; background: #22d3ee;
  bottom: -120px; right: -120px; animation: float2 14s ease-in-out infinite; }
.shape-3 { width: 260px; height: 260px; background: #f472b6;
  top: 50%; left: 50%; animation: float3 16s ease-in-out infinite; }

@keyframes float1 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(60px,80px) scale(1.15); }
}
@keyframes float2 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-60px,-70px) scale(1.2); }
}
@keyframes float3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-40%,-40%) scale(0.85); }
}

.login-card {
  position: relative; z-index: 2;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius-lg);
  padding: 44px 32px 36px;
  width: 100%; max-width: 420px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo-circle {
  width: 76px; height: 76px; margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  box-shadow: 0 12px 30px rgba(99,102,241,0.4);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.login-card h1 {
  font-size: 28px; font-weight: 900;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px; letter-spacing: -0.5px;
}

.subtitle { color: var(--gray); font-size: 14px; margin-bottom: 28px; }

.input-group { position: relative; margin-bottom: 14px; }
.input-icon {
  position: absolute; left: 18px; top: 50%;
  transform: translateY(-50%);
  font-size: 18px; opacity: 0.55;
  pointer-events: none; z-index: 1;
}
.input-group input {
  width: 100%;
  padding: 16px 16px 16px 50px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  transition: all 0.2s;
  background: #f8fafc;
  color: var(--dark);
}
.input-group input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
}

.btn-primary {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 8px 20px rgba(99,102,241,0.4);
  letter-spacing: 0.3px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99,102,241,0.5); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.error-msg {
  color: var(--danger); font-size: 14px;
  margin-top: 12px; min-height: 20px; font-weight: 600;
}

.hint-box {
  margin-top: 22px; padding: 12px 16px;
  background: linear-gradient(135deg, #eef2ff, #e0e7ff);
  border-radius: 10px; font-size: 13px;
  color: var(--gray); border: 1px solid #c7d2fe;
}
.hint-box b { color: var(--primary-dark); }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.shake { animation: shake 0.4s; }

/* ============================================================
   APP LAYOUT
============================================================ */
#appView { display: none; min-height: 100vh; min-height: 100dvh; }
#appView.active { display: block; }

/* ---------- TOP HEADER (мобиль үшін) ---------- */
.top-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: var(--white);
  padding: calc(18px + var(--safe-top)) 20px 20px;
  border-radius: 0 0 24px 24px;
  box-shadow: 0 8px 24px rgba(99,102,241,0.25);
  position: relative;
  overflow: hidden;
}

.top-header::before {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  top: -80px; right: -60px;
}
.top-header::after {
  content: '';
  position: absolute;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  bottom: -60px; left: -40px;
}

.top-header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 2;
}

.user-greeting {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  border: 2px solid rgba(255,255,255,0.35);
}

.user-info { display: flex; flex-direction: column; line-height: 1.25; }
.user-info .greet { font-size: 12px; opacity: 0.85; font-weight: 500; }
.user-info .name  { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }

.header-actions { display: flex; gap: 8px; }
.header-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.header-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.25); }

/* Мобильде басты контейнер */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px calc(100px + var(--safe-bottom));
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.35s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.page-header { margin-bottom: 20px; }
.page-header h1 {
  font-size: 24px; font-weight: 900;
  color: var(--dark); margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.page-sub { color: var(--gray); font-size: 14px; }

/* ============================================================
   SCHEDULE
============================================================ */
.day-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 8px;
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar { display: none; }

.day-tab {
  flex-shrink: 0;
  padding: 10px 18px;
  border-radius: 12px;
  background: var(--white);
  border: 1.5px solid var(--border);
  color: var(--gray);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  display: flex; flex-direction: column; align-items: center;
  min-width: 64px;
}
.day-tab .day-name { font-size: 12px; opacity: 0.7; font-weight: 600; }
.day-tab .day-num  { font-size: 16px; font-weight: 800; }

.day-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  border-color: transparent;
  box-shadow: 0 6px 16px rgba(99,102,241,0.35);
  transform: translateY(-2px);
}
.day-tab.active .day-name { opacity: 0.9; }

.lesson-list { display: flex; flex-direction: column; gap: 12px; }

.lesson-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  display: flex;
  gap: 14px;
  transition: all 0.25s;
  animation: slideUp 0.4s ease backwards;
  position: relative;
  overflow: hidden;
}

.lesson-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--primary);
}

.lesson-card.lecture::before { background: linear-gradient(180deg, #6366f1, #818cf8); }
.lesson-card.practice::before { background: linear-gradient(180deg, #06b6d4, #22d3ee); }
.lesson-card.lab::before { background: linear-gradient(180deg, #f59e0b, #fbbf24); }

.lesson-card:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-md);
}

.lesson-time {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 2px;
  min-width: 54px;
}

.lesson-time .start {
  font-size: 17px;
  font-weight: 900;
  color: var(--dark);
  letter-spacing: -0.5px;
}
.lesson-time .end {
  font-size: 12px;
  color: var(--gray);
  font-weight: 600;
}
.lesson-time .divider {
  width: 22px;
  height: 2px;
  background: var(--border);
  margin: 5px 0;
  border-radius: 2px;
}

.lesson-body { flex: 1; min-width: 0; }

.lesson-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
  margin-bottom: 6px;
  letter-spacing: -0.2px;
  line-height: 1.35;
}

.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--light);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #475569;
}

.meta-chip.teacher { background: #eef2ff; color: var(--primary-dark); }
.meta-chip.room    { background: #ecfdf5; color: #047857; }
.meta-chip.building{ background: #fef3c7; color: #b45309; }

.lesson-type-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.type-lecture  { background: #eef2ff; color: var(--primary-dark); }
.type-practice { background: #cffafe; color: #0e7490; }
.type-lab      { background: #fef3c7; color: #b45309; }

.empty-day {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray);
}
.empty-day .icon { font-size: 56px; margin-bottom: 12px; opacity: 0.5; }
.empty-day p { font-size: 15px; font-weight: 600; }

/* ============================================================
   GRADES
============================================================ */
.grades-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.summary-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.summary-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

.summary-card .icon { font-size: 22px; margin-bottom: 6px; }
.summary-card .value {
  font-size: 22px; font-weight: 900;
  color: var(--dark); letter-spacing: -0.5px;
  line-height: 1.1;
}
.summary-card .label {
  font-size: 11px; color: var(--gray);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 4px;
}
.summary-card.gpa .value { color: var(--primary); }
.summary-card.credits .value { color: var(--accent); }
.summary-card.rank .value { color: var(--warning); }

.grades-list { display: flex; flex-direction: column; gap: 12px; }

.grade-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: all 0.25s;
  animation: slideUp 0.4s ease backwards;
}
.grade-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

.grade-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.grade-subject {
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.2px;
  line-height: 1.3;
  flex: 1;
}
.grade-teacher {
  font-size: 12px;
  color: var(--gray);
  font-weight: 600;
  margin-top: 2px;
}

.grade-badge {
  flex-shrink: 0;
  min-width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 16px;
  letter-spacing: -0.5px;
}
.grade-A  { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
.grade-A- { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
.grade-B+ { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; }
.grade-B  { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; }
.grade-B- { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
.grade-C+ { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }

.grade-scores {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}

.score-item {
  text-align: center;
}
.score-item .score-label {
  font-size: 10.5px;
  color: var(--gray);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 4px;
}
.score-item .score-value {
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
}

.score-item.best .score-value { color: var(--success); }

.progress-bar {
  height: 6px;
  background: var(--light);
  border-radius: 6px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
}

/* ============================================================
   PROFILE
============================================================ */
.profile-hero {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: var(--radius-lg);
  padding: 28px 20px;
  text-align: center;
  color: var(--white);
  box-shadow: 0 12px 30px rgba(99,102,241,0.3);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.profile-hero::before {
  content: '';
  position: absolute;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  top: -100px; right: -80px;
}

.profile-avatar-lg {
  width: 88px; height: 88px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  margin: 0 auto 14px;
  border: 3px solid rgba(255,255,255,0.5);
  position: relative;
  z-index: 2;
}

.profile-hero h2 {
  font-size: 20px; font-weight: 900;
  letter-spacing: -0.4px; margin-bottom: 4px;
  position: relative; z-index: 2;
}
.profile-hero .group-info {
  font-size: 13px; opacity: 0.9;
  font-weight: 600; position: relative; z-index: 2;
}

.profile-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.form-row { margin-bottom: 16px; }
.form-row label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 800;
  color: var(--gray);
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.form-row input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  background: #f8fafc;
  transition: all 0.2s;
  color: var(--dark);
  font-weight: 600;
}
.form-row input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
}

.success-msg {
  color: var(--success); font-size: 14px; font-weight: 700;
  margin-top: 14px; text-align: center; min-height: 20px;
}

/* ============================================================
   BOTTOM NAV (мобиль)
============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 8px calc(8px + var(--safe-bottom));
  z-index: 90;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}

.bottom-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--gray);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  background: transparent;
  border: none;
  position: relative;
}

.bottom-nav-item .nav-icon {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s;
}

.bottom-nav-item:active .nav-icon { transform: scale(0.9); }

.bottom-nav-item.active {
  color: var(--primary-dark);
}

.bottom-nav-item.active .nav-icon {
  transform: translateY(-2px) scale(1.1);
}

.bottom-nav-item.active::before {
  content: '';
  position: absolute;
  top: 2px;
  width: 32px; height: 3px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
}

/* ============================================================
   NOTIFICATION / TOAST
============================================================ */
.notification {
  margin-top: 20px;
  padding: 16px 18px;
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  color: #065f46;
  border-left: 5px solid var(--success);

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   УТИЛИТЫ
============================================================ */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { console.warn(e); } }
  function safeRemove(k) { try { localStorage.removeItem(k); } catch (e) { console.warn(e); } }

  function showToast(msg, type = 'success') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ============================================================
     ДЕРЕКТЕР — КЕСТЕ
  ============================================================ */
  const SCHEDULE = {
    'Дүйсенбі': [
      { start: '08:30', end: '09:50', subject: 'Математикалық анализ', type: 'lecture',
        teacher: 'Ахметов Н.Б.', room: '301', building: '1-корпус' },
      { start: '10:00', end: '11:20', subject: 'Физика', type: 'practice',

      { start: '11:30', end: '12:50', subject: 'Бағдарламалау негіздері', type: 'lab',
        teacher: 'Нұрланұлы А.', room: '412', building: 'IT-орталық' },
      { start: '13:30', end: '14:50', subject: 'Ағылшын тілі', type: 'practice',

    'Сейсенбі': [

        teacher: 'Тұрсынов Е.М.', room: '305', building: 'IT-орталық' },

        teacher: 'Әбдіраш Д.Қ.', room: '418', building: 'IT-орталық' },
      { start: '11:30', end: '12:50', subject: 'Математикалық анализ', type: 'practice',

        teacher: 'Johnson M.', room: '108', building: '3-корпус' }
    ],

        teacher: 'Тұрсынов Е.М.', room: '312', building: 'IT-орталық' },
      { start: '10:00', end: '11:20', subject: 'Деректер қоры', type: 'lecture',
        teacher: 'Әбдіраш Д.Қ.', room: '305', building: 'IT-орталық' },
      { start: '11:30', end: '12:50', subject: 'Бағдарламалау негіздері', type: 'practice',
        teacher: 'Нұрланұлы А.', room: '412', building: 'IT-орталық' }
    ],
    'Жұма': [
      { start: '08:30', end: '09:50', subject: 'Веб-технологиялар', type: 'lecture',
        teacher: 'Жұмабаев А.С.', room: '301', building: 'IT-орталық' },
      { start: '10:00', end: '11:20', subject: 'Математикалық анализ', type: 'practice',
        teacher: 'Ахметов Н.Б.', room: '301', building: '1-корпус' },
      { start: '11:30', end: '12:50', subject: 'Физика', type: 'lab',
        teacher: 'Серікбаева Г.Т.', room: '215', building: '2-корпус' }
    ],
    'Сенбі': [] // Демалыс
  };

  const DAY_ORDER = ['Дүйсенбі', 'Сейсенбі', 'Сәрсенбі', 'Бейсенбі', 'Жұма', 'Сенбі'];
  const DAY_SHORT = { 'Дүйсенбі': 'Дс', 'Сейсенбі': 'Сс', 'Сәрсенбі': 'Ср',
                      'Бейсенбі': 'Бс', 'Жұма': 'Жм', 'Сенбі': 'Сб' };

  /* ============================================================
     ДЕРЕКТЕР — БАҒАЛАР
  ============================================================ */
  const GRADES = [
    { subject: 'Математикалық анализ', teacher: 'Ахметов Н.Б.',
      r1: 88, r2: 92, exam: 90, total: 'A', credits: 5 },
    { subject: 'Физика', teacher: 'Серікбаева Г.Т.',
      r1: 78, r2: 82, exam: 80, total: 'B+', credits: 4 },
    { subject: 'Бағдарламалау негіздері', teacher: 'Нұрланұлы А.',
      r1: 95, r2: 98, exam: 96, total: 'A', credits: 5 },
    { subject: 'Ағылшын тілі', teacher: 'Johnson M.',
      r1: 88, r2: 90, exam: 92, total: 'A-', credits: 3 },
    { subject: 'Алгоритмдер және деректер құрылымы', teacher: 'Тұрсынов Е.М.',
      r1: 90, r2: 94, exam: 92, total: 'A', credits: 5 },
    { subject: 'Деректер қоры', teacher: 'Әбдіраш Д.Қ.',
      r1: 85, r2: 88, exam: 86, total: 'A-', credits: 4 },
    { subject: 'Веб-технологиялар', teacher: 'Жұмабаев А.С.',
      r1: 92, r2: 95, exam: 93, total: 'A', credits: 4 },
    { subject: 'Тарих', teacher: 'Оспанова Л.Т.',
      r1: 74, r2: 79, exam: 81, total: 'B', credits: 3 }
  ];

  /* ============================================================
     АУТЕНТИФИКАЦИЯ
  ============================================================ */
  const DEMO_USER = 'student';
  const DEMO_PASS = '1234';

  function isLoggedIn() { return safeGet('loggedIn') === 'true'; }

  function showLogin() {
    $('#loginView').style.display = 'flex';
    $('#appView').classList.remove('active');
    document.body.style.overflow = '';
  }

  function showApp() {
    $('#loginView').style.display = 'none';
    $('#appView').classList.add('active');
    renderSchedule();
    renderGrades();
    loadProfile();
    updateHeaderName();
  }

  function updateHeaderName() {
    const name = safeGet('displayName') || 'Студент';
    const el = $('#headerName');
    if (el) el.textContent = name;
  }

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    e.stopPropagation();

    const user = $('#username').value.trim();
    const pass = $('#password').value.trim();
    const err = $('#errorMsg');

    if (!user || !pass) {
      err.textContent = '⚠️ Барлық өрісті толтырыңыз!';
      $('#loginCard').classList.add('shake');
      setTimeout(() => $('#loginCard').classList.remove('shake'), 500);
      return;
    }

    if (user === DEMO_USER && pass === DEMO_PASS) {
      err.textContent = '';
      const btn = $('#loginBtn');
      btn.disabled = true;
      btn.textContent = 'Кіру...';

      safeSet('loggedIn', 'true');
      safeSet('username', user);

      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Кіру →';
        showApp();
        showToast('Қош келдіңіз! 👋', 'success');
      }, 300);
    } else {
      err.textContent = '❌ Қате логин немесе құпия сөз!';
      $('#loginCard').classList.add('shake');
      setTimeout(() => $('#loginCard').classList.remove('shake'), 500);
    }
  });

  function logout() {
    safeRemove('loggedIn');
    safeRemove('username');
    showLogin();
    $('#username').value = '';
    $('#password').value = '';
    $('#errorMsg').textContent = '';
    showToast('Жүйеден шықтыңыз', 'success');
  }

  $('#headerLogout').addEventListener('click', logout);

  /* ============================================================
     НАВИГАЦИЯ
  ============================================================ */
  function navigateTo(target) {
    $$('.bottom-nav-item').forEach((b) => b.classList.toggle('active', b.dataset.nav === target));
    $$('.page').forEach((p) => p.classList.remove('active'));
    const page = $('#page-' + target);
    if (page) page.classList.add('active');
    $('#notification').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $$('.bottom-nav-item').forEach((btn) => {
    btn.addEventListener('click', function () {
      navigateTo(this.dataset.nav);
    });
  });

  /* ============================================================
     КЕСТЕ
  ============================================================ */
  let activeDay = getTodayKey();

  function getTodayKey() {
    const map = ['Дүйсенбі','Сейсенбі','Сәрсенбі','Бейсенбі','Жұма','Сенбі'];
    const idx = new Date().getDay(); // 0=Жексенбі
    const d = idx === 0 ? 0 : idx - 1;
    return map[d] || 'Дүйсенбі';
  }

  function renderSchedule() {
    // Day tabs
    const tabs = $('#dayTabs');
    tabs.innerHTML = '';
    DAY_ORDER.forEach((day) => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (day === activeDay ? ' active' : '');
      btn.innerHTML = `<span class="day-name">${DAY_SHORT[day]}</span><span class="day-num">${day.slice(0,3)}</span>`;
      btn.addEventListener('click', () => {
        activeDay = day;
        renderSchedule();
      });
      tabs.appendChild(btn);
    });

    // Subtitle
    $('#scheduleSubtitle').textContent = activeDay + ' күні';

    // Lessons
    const list = $('#lessonList');
    list.innerHTML = '';
    const lessons = SCHEDULE[activeDay] || [];

    if (lessons.length === 0) {
      list.innerHTML = `
        <div class="empty-day">
          <div class="icon">🎉</div>
          <p>Бұл күні сабақ жоқ. Демалыңыз!</p>
        </div>`;
      return;
    }

    lessons.forEach((l, i) => {
      const card = document.createElement('div');
      card.className = 'lesson-card ' + l.type;
      card.style.animationDelay = (i * 0.06) + 's';

      const typeLabel = l.type === 'lecture' ? 'Дәріс'
                      : l.type === 'practice' ? 'Практика'
                      : 'Зертхана';

      card.innerHTML = `
        <div class="lesson-time">
          <span class="start">${l.start}</span>
          <span class="divider"></span>
          <span class="end">${l.end}</span>
        </div>
        <div class="lesson-body">
          <span class="lesson-type-badge type-${l.type}">${typeLabel}</span>
          <div class="lesson-title">${l.subject}</div>
          <div class="lesson-meta">
            <span class="meta-chip teacher">👨‍🏫 ${l.teacher}</span>
            <span class="meta-chip room">🚪 ${l.room}</span>
            <span class="meta-chip building">🏛 ${l.building}</span>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  /* ============================================================
     БАҒАЛАР
  ============================================================ */
  function renderGrades() {
    // GPA есептеу
    const gradePoint = { 'A': 4.0, 'A-': 3.67, 'B+': 3.33, 'B': 3.0, 'B-': 2.67, 'C+': 2.33 };
    let totalPoints = 0, totalCredits = 0;
    GRADES.forEach(g => {
      const gp = gradePoint[g.total] || 0;
      totalPoints += gp * g.credits;
      totalCredits += g.credits;
    });
    const gpa = (totalPoints / totalCredits).toFixed(2);

    // Summary
    const avg = Math.round(
      GRADES.reduce((s, g) => s + (g.r1 + g.r2 + g.exam) / 3, 0) / GRADES.length
    );

    $('#gradesSummary').innerHTML = `
      <div class="summary-card gpa">
        <div class="icon">🎯</div>
        <div class="value">${gpa}</div>
        <div class="label">GPA</div>
      </div>
      <div class="summary-card credits">
        <div class="icon">📚</div>
        <div class="value">${totalCredits}</div>
        <div class="label">Кредит</div>
      </div>
      <div class="summary-card rank">
        <div class="icon">📈</div>
        <div class="value">${avg}</div>
        <div class="label">Орташа</div>
      </div>
    `;

    // Grades list
    const list = $('#gradesList');
    list.innerHTML = '';
    GRADES.forEach((g, i) => {
      const avgScore = Math.round((g.r1 + g.r2 + g.exam) / 3);
      const badgeClass = 'grade-' + g.total.replace('+', '\\+').replace('-', '\\-');

      const card = document.createElement('div');
      card.className = 'grade-card';
      card.style.animationDelay = (i * 0.05) + 's';
      card.innerHTML = `
        <div class="grade-header">
          <div style="flex:1;min-width:0;">
            <div class="grade-subject">${g.subject}</div>
            <div class="grade-teacher">👨‍🏫 ${g.teacher}</div>
          </div>
          <div class="grade-badge ${badgeClass}">${g.total}</div>
        </div>
        <div class="grade-scores">
          <div class="score-item"><div class="score-label">1-РК</div><div class="score-value">${g.r1}</div></div>
          <div class="score-item"><div class="score-label">2-РК</div><div class="score-value">${g.r2}</div></div>
          <div class="score-item"><div class="score-label">Емтихан</div><div class="score-value">${g.exam}</div></div>
          <div class="score-item best"><div class="score-label">Орташа</div><div class="score-value">${avgScore}</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${avgScore}%"></div></div>
      `;
      list.appendChild(card);
    });

    // Push-хабарлама
    setTimeout(() => {
      const n = $('#notification');
      n.innerHTML = '🔔 <div><b>Жаңа хабарлама:</b> Емтихан бағасы жарияланды — «Математикалық анализ»: <b>A</b></div>';
      n.classList.remove('hidden');
    }, 2000);
  }

     ПРОФИЛЬ
  ============================================================ */

    fullName: 'Асқар Нұрлан',
    email: 'askar@university.kz',
    phone: '+7 700 123 4567',
    group: 'IT-21'
  };

  function loadProfile() {
    let data = DEFAULT_PROFILE;
    try {
      const raw = safeGet('profile');
      if (raw) data = Object.assign({}, DEFAULT_PROFILE, JSON.parse(raw));
    } catch (e) { console.warn(e); }

    $('#fullName').value = data.fullName || '';
    $('#email').value = data.email || '';
    $('#phone').value = data.phone || '';
    $('#group').value = data.group || '';

    $('#heroName').textContent = data.fullName || 'Студент';
    $('#heroGroup').textContent = 'Топ: ' + (data.group || '—');
    $('#headerName').textContent = (data.fullName || 'Студент').split(' ')[0];
  }

  $('#profileForm').addEventListener('submit', function (e) {
    e.preventDefault();
    e.stopPropagation();

    const data = {
      fullName: $('#fullName').value.trim(),
      email: $('#email').value.trim(),
      phone: $('#phone').value.trim(),
      group: $('#group').value.trim()
    };

    safeSet('profile', JSON.stringify(data));
    safeSet('displayName', data.fullName || 'Студент');

    $('#heroName').textContent = data.fullName || 'Студент';
    $('#heroGroup').textContent = 'Топ: ' + (data.group || '—');
    updateHeaderName();

    const msg = $('#saveMsg');
    msg.textContent = '✅ Мәліметтер сәтті сақталды!';
    showToast('Профиль жаңартылды ✅', 'success');
    setTimeout(() => { msg.textContent = ''; }, 2500);
  });

  /* ============================================================
     INIT
  ============================================================ */
  function init() {
    if (isLoggedIn()) showApp();
    else showLogin();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
