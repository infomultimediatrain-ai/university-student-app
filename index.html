<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<title>University App — Университет порталы</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & VARIABLES
============================================================ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #C8102E;
  --primary-dark: #A00D24;
  --primary-light: #E63946;
  --primary-soft: #FEF2F2;
  --dark: #1A1A1A;
  --gray: #6B7280;
  --gray-light: #9CA3AF;
  --gray-bg: #F5F5F5;
  --white: #FFFFFF;
  --border: #E5E7EB;
  --success: #10B981;
  --warning: #F59E0B;
  --info: #06B6D4;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 14px;
  --radius-sm: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--gray-bg);
  color: var(--dark);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, input, select { font-family: inherit; font-size: 16px; }
button { border: none; background: none; cursor: pointer; color: inherit; }
a { text-decoration: none; color: inherit; }
input:focus, select:focus { outline: none; }

/* ============================================================
   LOGIN
============================================================ */
#loginView {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #C8102E 0%, #8B0820 60%, #1A1A1A 100%);
}

.bg-shapes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.shape { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.35; }
.shape-1 { width: 380px; height: 380px; background: #FF6B7A;
  top: -140px; left: -140px; animation: float1 12s ease-in-out infinite; }
.shape-2 { width: 320px; height: 320px; background: #FFB3BC;
  bottom: -120px; right: -120px; animation: float2 14s ease-in-out infinite; }

@keyframes float1 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(60px,80px) scale(1.15); }
}
@keyframes float2 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-60px,-70px) scale(1.2); }
}

.login-card {
  position: relative; z-index: 2;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(20px);
  border-radius: 22px;
  padding: 32px 28px 28px;
  width: 100%; max-width: 440px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Language switcher (top-right of login) */
.lang-switch {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  margin-bottom: 12px;
}

.lang-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--gray-bg);
  color: var(--gray);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}
.lang-btn.active {
  background: var(--primary);
  color: var(--white);
}

.logo-circle {
  width: 68px; height: 68px; margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  box-shadow: 0 12px 30px rgba(200,16,46,0.35);
}

.login-card h1 {
  font-size: 23px; font-weight: 900;
  color: var(--primary);
  margin-bottom: 4px; letter-spacing: -0.5px;
  text-align: center;
}

.subtitle {
  color: var(--gray); font-size: 13px;
  margin-bottom: 20px; text-align: center;
}

/* Рөл таңдау */
.role-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
  background: var(--gray-bg);
  padding: 5px;
  border-radius: 14px;
}

.role-btn {
  padding: 10px 8px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray);
  transition: all 0.25s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.role-btn.active {
  background: var(--white);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.input-group { position: relative; margin-bottom: 12px; }
.input-icon {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 17px; opacity: 0.5; pointer-events: none;
}
.input-group input {
  width: 100%;
  padding: 14px 14px 14px 46px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14.5px;
  transition: all 0.2s;
  background: #FAFAFA;
}
.input-group input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(200,16,46,0.1);
}

.btn-primary {
  width: 100%; padding: 15px; margin-top: 6px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  border-radius: 12px;
  font-size: 15px; font-weight: 700;
  transition: all 0.25s;
  box-shadow: 0 8px 20px rgba(200,16,46,0.3);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.6; }

.error-msg {
  color: var(--primary); font-size: 13px;
  margin-top: 10px; min-height: 18px; font-weight: 600;
  text-align: center;
}

.hint-box {
  margin-top: 16px; padding: 10px 14px;
  background: var(--primary-soft);
  border-radius: 10px; font-size: 12px;
  color: var(--gray); border: 1px solid #FECACA;
  text-align: center;
}
.hint-box b { color: var(--primary); }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.shake { animation: shake 0.4s; }

/* ============================================================
   APP
============================================================ */
#appView { display: none; min-height: 100vh; min-height: 100dvh; }
#appView.active { display: block; }

.topbar {
  position: sticky; top: 0;
  background: var(--white);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 6px; min-width: 44px; }
.topbar-right { justify-content: flex-end; }

.icon-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--dark);
  transition: background 0.2s;
}
.icon-btn:active { background: var(--gray-bg); }

.topbar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.3px;
  flex: 1;
  text-align: center;
}

.page-content {
  padding: 16px 16px calc(96px + var(--safe-bottom));
  max-width: 720px;
  margin: 0 auto;
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Role indicator bar */
.role-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--primary-soft), #FFF5F5);
  border: 1px solid #FECACA;
  border-radius: 12px;
  margin-bottom: 14px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--primary-dark);
}
.role-bar .role-icon {
  width: 28px; height: 28px;
  background: var(--white);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.role-bar .role-info { flex: 1; }
.role-bar .role-info small {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--gray);
  letter-spacing: 0.3px;
}

/* Tabs */
.tabs-row {
  display: flex;
  gap: 6px;
  padding: 4px 0 12px;
  align-items: center;
}

.tab-pill {
  padding: 9px 16px;
  border-radius: 22px;
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--dark);
  font-size: 13px;
  font-weight: 700;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-pill.active {
  background: var(--primary);
  color: var(--white);
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(200,16,46,0.25);
}

/* Lesson card */
.lesson-card {
  background: var(--white);
  border-radius: var(--radius);
  margin-bottom: 10px;
  padding: 14px;
  display: flex;
  gap: 14px;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.35s ease backwards;
  transition: transform 0.2s;
}
.lesson-card:active { transform: scale(0.99); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.lesson-time {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding-top: 2px;
  min-width: 50px;
}
.lesson-time .time-start {
  font-size: 15px; font-weight: 800;
  color: var(--dark); letter-spacing: -0.3px;
  line-height: 1.2;
}
.lesson-time .time-end {
  font-size: 13px; font-weight: 500;
  color: var(--gray-light); line-height: 1.2;
  margin-top: 2px;
}

.lesson-body { flex: 1; min-width: 0; }

.lesson-subject {
  font-size: 14.5px; font-weight: 800;
  color: var(--dark); line-height: 1.3;
  margin-bottom: 8px; letter-spacing: -0.2px;
}

.lesson-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.info-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 12.5px;
  color: var(--gray);
  line-height: 1.4;
}
.info-row .info-icon {
  flex-shrink: 0;
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.6;
  margin-top: 1px;
}
.info-row .info-text {
  flex: 1; min-width: 0;
  color: var(--gray); font-weight: 500;
  word-wrap: break-word;
}
.info-row .info-text.strong {
  color: var(--dark); font-weight: 600;
}

/* Day strip */
.day-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 0 12px;
  margin: 0 -16px;
  padding-left: 16px;
  padding-right: 16px;
  scrollbar-width: none;
}
.day-strip::-webkit-scrollbar { display: none; }

.day-chip {
  flex-shrink: 0;
  padding: 9px 14px;
  border-radius: 12px;
  background: var(--white);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 56px;
  transition: all 0.2s;
}
.day-chip .day-name {
  font-size: 10.5px; font-weight: 700;
  color: var(--gray); text-transform: uppercase;
  letter-spacing: 0.5px;
}
.day-chip .day-num {
  font-size: 16px; font-weight: 900;
  color: var(--dark); margin-top: 2px;
}
.day-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(200,16,46,0.25);
}
.day-chip.active .day-name { color: rgba(255,255,255,0.85); }
.day-chip.active .day-num { color: var(--white); }

/* Empty */
.empty-state {
  text-align: center;
  padding: 50px 20px;
}
.empty-state .icon { font-size: 52px; margin-bottom: 10px; opacity: 0.4; }
.empty-state p { font-size: 14px; font-weight: 600; color: var(--gray); }

/* Exams */
.exam-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--primary);
}
.exam-date {
  display: inline-block;
  padding: 4px 10px;
  background: var(--primary-soft);
  color: var(--primary);
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 800;
  margin-bottom: 8px;
}
.exam-subject {
  font-size: 14.5px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--dark);
}
.exam-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 12px;
  color: var(--gray);
}
.exam-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--gray-bg);
  border-radius: 6px;
  font-weight: 600;
}

/* ============================================================
   GRADES
============================================================ */
.grades-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.summary-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.summary-card .icon { font-size: 18px; margin-bottom: 3px; }
.summary-card .value {
  font-size: 20px; font-weight: 900;
  letter-spacing: -0.5px; line-height: 1.1;
}
.summary-card .label {
  font-size: 10px; color: var(--gray);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.4px; margin-top: 2px;
}
.summary-card.gpa .value { color: var(--primary); }
.summary-card.credits .value { color: var(--info); }
.summary-card.rank .value { color: var(--warning); }

.grade-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.35s ease backwards;
}
.grade-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.grade-subject {
  font-size: 14.5px; font-weight: 800;
  line-height: 1.3; color: var(--dark);
  letter-spacing: -0.2px;
}
.grade-teacher {
  font-size: 11.5px; color: var(--gray);
  margin-top: 3px; font-weight: 500;
}
.grade-badge {
  flex-shrink: 0;
  min-width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 15px;
}
.grade-A  { background: #D1FAE5; color: #065F46; }
.grade-A- { background: #D1FAE5; color: #065F46; }
.grade-B+ { background: #DBEAFE; color: #1E40AF; }
.grade-B  { background: #DBEAFE; color: #1E40AF; }
.grade-C  { background: #FEF3C7; color: #92400E; }

.grade-scores {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.score-item { text-align: center; }
.score-item .score-label {
  font-size: 10px; color: var(--gray);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.3px; margin-bottom: 3px;
}
.score-item .score-value {
  font-size: 14px; font-weight: 800; color: var(--dark);
}
.score-item.best .score-value { color: var(--success); }

.progress-bar {
  height: 5px;
  background: var(--gray-bg);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 10px;
}
.progress-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
}

/* ============================================================
   HOME / HERO
============================================================ */
.hero-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius);
  padding: 20px 18px;
  color: var(--white);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(200,16,46,0.25);
}
.hero-card::before {
  content: '';
  position: absolute;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  top: -80px; right: -60px;
}
.hero-card h2 {
  font-size: 18px; font-weight: 900;
  margin-bottom: 4px; letter-spacing: -0.3px;
  position: relative;
}
.hero-card p {
  font-size: 12.5px; opacity: 0.9;
  font-weight: 500; position: relative;
}

.section-title {
  font-size: 14px; font-weight: 800;
  color: var(--dark);
  margin: 18px 0 10px;
  letter-spacing: -0.2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.section-title .count {
  font-size: 11.5px;
  color: var(--gray);
  font-weight: 600;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.quick-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.15s;
  cursor: pointer;
}
.quick-card:active { transform: scale(0.97); }
.quick-card .q-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  background: var(--primary-soft);
}
.quick-card .q-text .q-title {
  font-size: 13px; font-weight: 800; color: var(--dark);
}
.quick-card .q-text .q-sub {
  font-size: 11px; color: var(--gray); font-weight: 500;
}

/* ============================================================
   PROFILE
============================================================ */
.profile-hero {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius);
  padding: 22px 18px;
  text-align: center;
  color: var(--white);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(200,16,46,0.25);
}
.profile-hero::before {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  top: -100px; right: -60px;
}
.profile-avatar-lg {
  width: 78px; height: 78px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  margin: 0 auto 12px;
  border: 3px solid rgba(255,255,255,0.5);
  position: relative;
}
.profile-hero h2 {
  font-size: 18px; font-weight: 900;
  letter-spacing: -0.3px; margin-bottom: 3px;
  position: relative;
}
.profile-hero .group-info {
  font-size: 12.5px; opacity: 0.9;
  font-weight: 600; position: relative;
}
.role-badge-pill {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 12px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  position: relative;
}

.form-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.form-row { margin-bottom: 13px; }
.form-row label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800;
  color: var(--gray); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.form-row input {
  width: 100%;
  padding: 13px 15px;
  border: 2px solid var(--border);
  border-radius: 11px;
  font-size: 14.5px;
  background: #FAFAFA;
  transition: all 0.2s;
  color: var(--dark);
  font-weight: 600;
}
.form-row input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(200,16,46,0.1);
}

.success-msg {
  color: var(--success); font-size: 13px;
  font-weight: 700; margin-top: 12px;
  text-align: center; min-height: 18px;
}

/* Language section in profile */
.lang-section {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 12px;
  box-shadow: var(--shadow-sm);
}
.lang-section h3 {
  font-size: 12px;
  font-weight: 800;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
}
.lang-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.lang-option {
  padding: 12px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--white);
  font-size: 14px;
  font-weight: 700;
  color: var(--gray);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.lang-option.active {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary);
}

/* ============================================================
   TEACHER: ATTENDANCE / GRADE ENTRY
============================================================ */
.student-row {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-sm);
}

.student-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: var(--white);
  flex-shrink: 0;
}

.student-info { flex: 1; min-width: 0; }
.student-name {
  font-size: 14px; font-weight: 800;
  color: var(--dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.student-meta {
  font-size: 11.5px;
  color: var(--gray);
  font-weight: 500;
}

.attendance-btns {
  display: flex;
  gap: 4px;
}
.att-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  font-size: 16px;
  border: 2px solid var(--border);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.att-btn.present.active { background: #D1FAE5; border-color: var(--success); }
.att-btn.absent.active  { background: #FEE2E2; border-color: #EF4444; }
.att-btn.late.active    { background: #FEF3C7; border-color: var(--warning); }

.grade-input {
  width: 60px;
  padding: 8px;
  border: 2px solid var(--border);
  border-radius: 10px;
  text-align: center;
  font-weight: 800;
  font-size: 14px;
  color: var(--dark);
  background: var(--white);
}
.grade-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(200,16,46,0.1);
}

.save-fab {
  position: fixed;
  bottom: calc(100px + var(--safe-bottom));
  right: 20px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(200,16,46,0.4);
  z-index: 95;
  transition: transform 0.2s;
}
.save-fab:active { transform: scale(0.92); }

/* Student list search */
.search-box {
  position: relative;
  margin-bottom: 12px;
}
.search-box input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  background: var(--white);
  font-weight: 500;
}
.search-box .search-icon {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  opacity: 0.5;
  pointer-events: none;
}

/* ============================================================
   BOTTOM NAV
============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 6px 6px calc(6px + var(--safe-bottom));
  z-index: 90;
  max-width: 720px;
  margin: 0 auto;
}

.bottom-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 12px;
  color: var(--gray);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2px;
  transition: color 0.2s;
  position: relative;
}
.bottom-nav-item .nav-icon {
  font-size: 21px;
  line-height: 1;
  transition: transform 0.2s;
}
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item.active .nav-icon { transform: translateY(-1px) scale(1.08); }

/* ============================================================
   NOTIFICATION & TOAST
============================================================ */
.notification {
  margin-top: 14px;
  padding: 13px 15px;
  background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
  color: #065F46;
  border-left: 4px solid var(--success);
  border-radius: 12px;
  font-weight: 600;
  font-size: 13px;
  display: flex; align-items: flex-start; gap: 10px;
  animation: slideDown 0.4s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.hidden { display: none !important; }

.toast {
  position: fixed;
  bottom: calc(92px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(200px);
  background: var(--dark);
  color: var(--white);
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 700;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  z-index: 1000;
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: linear-gradient(135deg, #059669, #10B981); }
.toast.error { background: linear-gradient(135deg, #DC2626, #EF4444); }

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 360px) {
  .page-content { padding: 12px 12px calc(96px + var(--safe-bottom)); }
  .lesson-card { padding: 12px; gap: 10px; }
  .lesson-time { min-width: 44px; }
  .lesson-time .time-start { font-size: 13.5px; }
  .lesson-time .time-end { font-size: 11.5px; }
  .lesson-subject { font-size: 13.5px; }
  .info-row { font-size: 11.5px; }
}

  function renderGrades() {
    const gradePoint = { 'A': 4.0, 'A-': 3.67, 'B+': 3.33, 'B': 3.0, 'B-': 2.67, 'C+': 2.33 };
    let totalPoints = 0, totalCredits = 0;
    GRADES.forEach(g => {
      totalPoints += (gradePoint[g.total] || 0) * g.credits;
      totalCredits += g.credits;
    });
    const gpa = (totalPoints / totalCredits).toFixed(2);
    const avg = Math.round(GRADES.reduce((s, g) => s + (g.r1 + g.r2 + g.exam) / 3, 0) / GRADES.length);

    $('#gradesSummary').innerHTML = `
      <div class="summary-card gpa"><div class="icon">🎯</div><div class="value">${gpa}</div><div class="label">${t('gpa')}</div></div>
      <div class="summary-card credits"><div class="icon">📚</div><div class="value">${totalCredits}</div><div class="label">${t('credits')}</div></div>
      <div class="summary-card rank"><div class="icon">📈</div><div class="value">${avg}</div><div class="label">${t('average')}</div></div>
    `;

    const list = $('#gradesList');
    list.innerHTML = '';
    GRADES.forEach((g, i) => {
      const avgScore = Math.round((g.r1 + g.r2 + g.exam) / 3);
      const badgeClass = 'grade-' + g.total.replace('+','\\+').replace('-','\\-');
      const card = document.createElement('div');
      card.className = 'grade-card';
      card.style.animationDelay = (i * 0.04) + 's';
      card.innerHTML = `
        <div class="grade-header">
          <div style="flex:1;min-width:0;">
            <div class="grade-subject">${g.subject}</div>
            <div class="grade-teacher">🎓 ${g.teacher}</div>
          </div>
          <div class="grade-badge ${badgeClass}">${g.total}</div>
        </div>
        <div class="grade-scores">
          <div class="score-item"><div class="score-label">1-РК</div><div class="score-value">${g.r1}</div></div>
          <div class="score-item"><div class="score-label">2-РК</div><div class="score-value">${g.r2}</div></div>
          <div class="score-item"><div class="score-label">${currentLang === 'kk' ? 'Емтихан' : 'Экзамен'}</div><div class="score-value">${g.exam}</div></div>
          <div class="score-item best"><div class="score-label">${t('average')}</div><div class="score-value">${avgScore}</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${avgScore}%"></div></div>
      `;
      list.appendChild(card);
    });

    setTimeout(() => {
      const n = $('#notification');
      n.innerHTML = `🔔 <div><b>${currentLang === 'kk' ? 'Жаңа хабарлама' : 'Новое уведомление'}:</b> ${
        currentLang === 'kk' ? 'Емтихан бағасы жарияланды' : 'Опубликована оценка за экзамен'
      } — «Математикалық анализ»: <b>A</b></div>`;
      n.classList.remove('hidden');
    }, 2000);
  }

  function renderJournal() {

  function renderJournalList() {
    const search = ($('#studentSearch').value || '').toLowerCase().trim();
    const filtered = STUDENTS.filter(s =>
      !search || s.name.toLowerCase().includes(search) || s.group.toLowerCase().includes(search)
    );

    const list = $('#journalList');
    list.innerHTML = '';

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>${
        currentLang === 'kk' ? 'Ешкім табылмады' : 'Никого не найдено'
      }</p></div>`;
      return;
    }

    filtered.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.style.animationDelay = (i * 0.03) + 's';

      const initials = s.name.split(' ').map(w => w[0]).slice(0,2).join('');

      if (activeJournalTab === 'attendance') {
        const status = attendanceData[s.id] || '';
        row.innerHTML = `
          <div class="student-avatar">${initials}</div>
          <div class="student-info">
            <div class="student-name">${s.name}</div>
            <div class="student-meta">${s.group}</div>
          </div>
          <div class="attendance-btns">
            <button class="att-btn present ${status === 'present' ? 'active' : ''}" data-id="${s.id}" data-status="present" title="${t('present')}">✓</button>
            <button class="att-btn late ${status === 'late' ? 'active' : ''}" data-id="${s.id}" data-status="late" title="${t('late')}">⏱</button>
            <button class="att-btn absent ${status === 'absent' ? 'active' : ''}" data-id="${s.id}" data-status="absent" title="${t('absent')}">✕</button>
          </div>
        `;
      } else {
        const val = gradeEntryData[s.id] || '';
        row.innerHTML = `
          <div class="student-avatar">${initials}</div>
          <div class="student-info">
            <div class="student-name">${s.name}</div>
            <div class="student-meta">${s.group}</div>
          </div>
          <input type="number" min="0" max="100" class="grade-input" data-id="${s.id}" value="${val}" placeholder="0-100">
        `;
      }
      list.appendChild(row);
    });

    // Attach events
    list.querySelectorAll('.att-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const id = parseInt(this.dataset.id);
        attendanceData[id] = this.dataset.status;
        renderJournalList();
      });
    });

    list.querySelectorAll('.grade-input').forEach(inp => {
      inp.addEventListener('input', function () {
        const id = parseInt(this.dataset.id);
        let v = this.value;
        if (v !== '') {
          let n = parseInt(v);
          if (isNaN(n)) n = 0;
          if (n < 0) n = 0;
          if (n > 100) n = 100;
          if (n !== parseInt(v)) this.value = n;
        }
        gradeEntryData[id] = this.value;
      });
    });
  }

  $('#studentSearch').addEventListener('input', renderJournalList);

  document.addEventListener('click', function (e) {
    const pill = e.target.closest('.tab-pill[data-jtab]');
    if (pill) {
      activeJournalTab = pill.dataset.jtab;
      renderJournal();
    }
  });

  $('#saveFab').addEventListener('click', function () {
    try {
      safeSet('attendance', JSON.stringify(attendanceData));
      safeSet('grades_entry', JSON.stringify(gradeEntryData));
    } catch (e) {}
    showToast(t('journalSaved'));
  });

  /* ============================================================
     БАСТЫ БЕТ
  ============================================================ */
  function renderHome() {
    const hour = new Date().getHours();
    let greetKey = 'greetDay';
    if (hour < 12) greetKey = 'greetMorning';
    else if (hour >= 18) greetKey = 'greetEvening';

    const profile = getProfileData();
    $('#heroGreeting').textContent = t(greetKey) + ' 👋';
    $('#heroName').textContent = (profile.fullName || 'User') +
      (currentRole === 'student' ? ' • ' + (profile.group || '—') : ' • ' + (profile.department || '—'));

    // Role bar
    $('#roleBarIcon').textContent = currentRole === 'student' ? '🎓' : '👨‍🏫';
    $('#roleBarText').textContent = currentRole === 'student' ? t('roleStudent') : t('roleTeacher');
    $('#roleBarSub').textContent = t('roleActiveMode');

    // Title
    $('#todayTitle').textContent = currentRole === 'student' ? t('todayTitle') : t('todayTitleTeacher');
    $('#quickTitle').textContent = t('quickTitle');

    // Today preview
    const dayMap = ['Дүйсенбі','Сейсенбі','Сәрсенбі','Бейсенбі','Жұма','Сенбі','Жексенбі'];
    const today = new Date().getDay();
    const todayKey = dayMap[today];
    let todayLessons = SCHEDULE[todayKey] || [];

    // If teacher — show lessons they teach
    if (currentRole === 'teacher') {
      const teacherName = safeGet('displayName') || 'Карменова М.А.';
      todayLessons = todayLessons.filter(l => l.teacher === teacherName);
    }

    $('#todayCount').textContent = todayLessons.length + ' ' + t('lessonsCount');
    const preview = $('#todayPreview');
    preview.innerHTML = '';
    if (todayLessons.length === 0) {
      preview.innerHTML = `<div class="empty-state" style="padding:30px 20px;"><div class="icon" style="font-size:44px;">🎉</div><p style="font-size:13px;">${t('noLessonsToday')}</p></div>`;
    } else {
      todayLessons.slice(0, 2).forEach((l, i) => preview.appendChild(buildLessonCard(l, i)));
    }

    // Quick grid
    const qg = $('#quickGrid');
    qg.innerHTML = '';
    const quickItems = currentRole === 'student' ? [
      { icon: '📅', title: t('quickSchedule'), sub: t('quickScheduleSub'), goto: 'schedule' },
      { icon: '📊', title: t('quickGrades'), sub: t('quickGradesSub'), goto: 'grades' }
    ] : [
      { icon: '📋', title: t('quickJournal'), sub: t('quickJournalSub'), goto: 'journal' },
      { icon: '📅', title: t('quickSchedule'), sub: t('quickScheduleSub'), goto: 'schedule' }
    ];
    quickItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'quick-card';
      card.innerHTML = `
        <div class="q-icon">${item.icon}</div>
        <div class="q-text">
          <div class="q-title">${item.title}</div>
          <div class="q-sub">${item.sub}</div>
        </div>
      `;
      card.addEventListener('click', () => navigateTo(item.goto));
      qg.appendChild(card);
    });
  }

  /* ============================================================
     ПРОФИЛЬ
  ============================================================ */
  const DEFAULT_STUDENT_PROFILE = {
    fullName: 'Асқар Нұрлан',
    email: 'askar@university.kz',
    phone: '+7 700 123 4567',
    group: 'IT-21'
  };
  const DEFAULT_TEACHER_PROFILE = {
    fullName: 'Карменова М.А.',
    email: 'karmenova@university.kz',
    phone: '+7 701 234 5678',
    department: 'Информатика кафедрасы'
  };

  function getProfileKey() { return 'profile_' + currentRole; }

  function getProfileData() {
    const def = currentRole === 'teacher' ? DEFAULT_TEACHER_PROFILE : DEFAULT_STUDENT_PROFILE;
    try {
      const raw = safeGet(getProfileKey());
      if (raw) return Object.assign({}, def, JSON.parse(raw));
    } catch (e) {}
    return Object.assign({}, def);
  }

  function loadProfile() {
    const data = getProfileData();
    $('#fullName').value = data.fullName || '';
    $('#email').value = data.email || '';
    $('#phone').value = data.phone || '';

    if (currentRole === 'teacher') {
      $('#groupRow').style.display = 'none';
      $('#deptRow').style.display = 'block';
      $('#department').value = data.department || '';
      $('#profileAvatar').textContent = '👨‍🏫';
      $('#roleBadge').textContent = t('roleBadgeTeacher');
    } else {
      $('#groupRow').style.display = 'block';
      $('#deptRow').style.display = 'none';
      $('#group').value = data.group || '';
      $('#profileAvatar').textContent = '👤';
      $('#roleBadge').textContent = t('roleBadgeStudent');
    }

    $('#heroName2').textContent = data.fullName || 'User';
    if (currentRole === 'teacher') {
      $('#heroGroup').textContent = data.department || '—';
    } else {
      $('#heroGroup').textContent = (currentLang === 'kk' ? 'Топ: ' : 'Группа: ') + (data.group || '—');
    }
  }

  $('#profileForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {
      fullName: $('#fullName').value.trim(),
      email: $('#email').value.trim(),
      phone: $('#phone').value.trim()
    };
    if (currentRole === 'teacher') {
      data.department = $('#department').value.trim();
    } else {
      data.group = $('#group').value.trim();
    }
    safeSet(getProfileKey(), JSON.stringify(data));
    safeSet('displayName', data.fullName || 'User');
    loadProfile();
    renderHome();
    const msg = $('#saveMsg');
    msg.textContent = t('saved');
    showToast(t('profileUpdated'));
    setTimeout(() => { msg.textContent = ''; }, 2500);
  });

  /* ============================================================
     INIT
  ============================================================ */
  function renderAll() {
    applyTranslations();
    renderSchedule();
    if (currentRole === 'student') {
      renderGrades();
    } else {
      renderJournal();
    }
    renderHome();
    loadProfile();
    // Show/hide pages based on role
    if (currentRole === 'student') {
      // ok
    } else {
      // Ensure teacher doesn't see grades page
      // Navigation handled by bottom nav
    }
  }

  function init() {
    currentLang = safeGet('lang') || 'kk';
    currentRole = safeGet('role') || 'student';

    // Restore role selection on login screen
    $$('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === currentRole));

    applyTranslations();

    if (isLoggedIn()) {
      // Use saved role
      const savedRole = safeGet('role');
      if (savedRole) currentRole = savedRole;
      // Restore data
      try {
        const a = safeGet('attendance'); if (a) attendanceData = JSON.parse(a);
        const g = safeGet('grades_entry'); if (g) gradeEntryData = JSON.parse(g);
      } catch (e) {}
      showApp();
    } else {
      showLogin();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
