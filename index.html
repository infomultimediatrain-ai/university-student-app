<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<title>Student App — Университет</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & VARIABLES
============================================================ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #C8102E;
  --primary-dark: #A00D24;
  --primary-light: #E63946;
  --primary-soft: #FEF2F2;
  --dark: #1A1A1A;
  --gray: #6B7280;
  --gray-light: #9CA3AF;
  --gray-bg: #F5F5F5;
  --white: #FFFFFF;
  --border: #E5E7EB;
  --success: #10B981;
  --success-soft: #D1FAE5;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 14px;
  --radius-sm: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--gray-bg);
  color: var(--dark);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, input { font-family: inherit; font-size: 16px; }
button { border: none; background: none; cursor: pointer; color: inherit; }
a { text-decoration: none; color: inherit; }
input:focus { outline: none; }

/* ============================================================
   LOGIN
============================================================ */
#loginView {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #C8102E 0%, #8B0820 60%, #1A1A1A 100%);
}

.bg-shapes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.shape { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.35; }
.shape-1 { width: 380px; height: 380px; background: #FF6B7A;
  top: -140px; left: -140px; animation: float1 12s ease-in-out infinite; }
.shape-2 { width: 320px; height: 320px; background: #FFB3BC;
  bottom: -120px; right: -120px; animation: float2 14s ease-in-out infinite; }

@keyframes float1 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(60px,80px) scale(1.15); }
}
@keyframes float2 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-60px,-70px) scale(1.2); }
}

.login-card {
  position: relative; z-index: 2;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(20px);
  border-radius: 22px;
  padding: 44px 32px 36px;
  width: 100%; max-width: 420px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  text-align: center;
  animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo-circle {
  width: 76px; height: 76px; margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  box-shadow: 0 12px 30px rgba(200,16,46,0.35);
}

.login-card h1 {
  font-size: 26px; font-weight: 900;
  color: var(--primary);
  margin-bottom: 6px; letter-spacing: -0.5px;
}

.subtitle { color: var(--gray); font-size: 14px; margin-bottom: 28px; }

.input-group { position: relative; margin-bottom: 14px; }
.input-icon {
  position: absolute; left: 18px; top: 50%;
  transform: translateY(-50%);
  font-size: 18px; opacity: 0.5; pointer-events: none;
}
.input-group input {
  width: 100%;
  padding: 16px 16px 16px 50px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  transition: all 0.2s;
  background: #FAFAFA;
}
.input-group input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(200,16,46,0.1);
}

.btn-primary {
  width: 100%; padding: 16px; margin-top: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  border-radius: 12px;
  font-size: 16px; font-weight: 700;
  transition: all 0.25s;
  box-shadow: 0 8px 20px rgba(200,16,46,0.3);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.6; }

.error-msg {
  color: var(--primary); font-size: 14px;
  margin-top: 12px; min-height: 20px; font-weight: 600;
}

.hint-box {
  margin-top: 22px; padding: 12px 16px;
  background: var(--primary-soft);
  border-radius: 10px; font-size: 13px;
  color: var(--gray); border: 1px solid #FECACA;
}
.hint-box b { color: var(--primary); }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.shake { animation: shake 0.4s; }

/* ============================================================
   APP
============================================================ */
#appView { display: none; min-height: 100vh; min-height: 100dvh; }
#appView.active { display: block; }

/* ---------- TOP BAR ---------- */
.topbar {
  position: sticky; top: 0;
  background: var(--white);
  padding: calc(14px + var(--safe-top)) 16px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}

.topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; min-width: 44px; }
.topbar-right { justify-content: flex-end; }

.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  color: var(--dark);
  transition: background 0.2s;
}
.icon-btn:active { background: var(--gray-bg); }

.topbar-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.3px;
  flex: 1;
  text-align: center;
}

/* ---------- PAGE CONTENT ---------- */
.page-content {
  padding: 16px 16px calc(96px + var(--safe-bottom));
  max-width: 720px;
  margin: 0 auto;
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- TABS (Занятия/Экзамены/ИГА) ---------- */
.tabs-row {
  display: flex;
  gap: 8px;
  padding: 4px 0 14px;
  align-items: center;
}

.tab-pill {
  padding: 10px 20px;
  border-radius: 24px;
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--dark);
  font-size: 14px;
  font-weight: 700;
  transition: all 0.2s;
  white-space: nowrap;
}

.tab-pill.active {
  background: var(--primary);
  color: var(--white);
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(200,16,46,0.25);
}

.filter-btn {
  margin-left: auto;
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--white);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
  font-size: 18px;
}
.filter-btn:active { background: var(--gray-bg); }

/* ---------- LESSON CARD (Kaitesin стилі) ---------- */
.lesson-card {
  background: var(--white);
  border-radius: var(--radius);
  margin-bottom: 12px;
  padding: 16px;
  display: flex;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.35s ease backwards;
  transition: transform 0.2s;
}

.lesson-card:active { transform: scale(0.99); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.lesson-time {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-top: 2px;
  min-width: 52px;
}

.lesson-time .time-start {
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.lesson-time .time-end {
  font-size: 14px;
  font-weight: 500;
  color: var(--gray-light);
  line-height: 1.2;
  margin-top: 2px;
}

.lesson-body { flex: 1; min-width: 0; }

.lesson-subject {
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
  line-height: 1.3;
  margin-bottom: 10px;
  letter-spacing: -0.2px;
}

.lesson-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.info-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--gray);
  line-height: 1.45;
}

.info-row .info-icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.6;
  margin-top: 1px;
}

.info-row .info-text {
  flex: 1;
  min-width: 0;
  color: var(--gray);
  font-weight: 500;
  word-wrap: break-word;
}

.info-row .info-text.strong {
  color: var(--dark);
  font-weight: 600;
}

/* ---------- DAY SELECTOR (horizontal scroll) ---------- */
.day-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 0 12px;
  margin: 0 -16px;
  padding-left: 16px;
  padding-right: 16px;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
.day-strip::-webkit-scrollbar { display: none; }

.day-chip {
  flex-shrink: 0;
  padding: 10px 16px;
  border-radius: 12px;
  background: var(--white);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 58px;
  transition: all 0.2s;
}

.day-chip .day-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.day-chip .day-num {
  font-size: 17px;
  font-weight: 900;
  color: var(--dark);
  margin-top: 2px;
}

.day-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(200,16,46,0.25);
}
.day-chip.active .day-name { color: rgba(255,255,255,0.85); }
.day-chip.active .day-num { color: var(--white); }

/* ---------- EMPTY ---------- */
.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-state .icon { font-size: 56px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 15px; font-weight: 600; color: var(--gray); }

/* ---------- EXAMS ---------- */
.exam-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--primary);
}
.exam-date {
  display: inline-block;
  padding: 4px 10px;
  background: var(--primary-soft);
  color: var(--primary);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 8px;
}
.exam-subject {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--dark);
}
.exam-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  color: var(--gray);
}
.exam-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--gray-bg);
  border-radius: 6px;
  font-weight: 600;
}

/* ============================================================
   GRADES
============================================================ */
.grades-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.summary-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.summary-card .icon { font-size: 20px; margin-bottom: 4px; }
.summary-card .value {
  font-size: 22px; font-weight: 900;
  letter-spacing: -0.5px; line-height: 1.1;
}
.summary-card .label {
  font-size: 10.5px; color: var(--gray);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 2px;
}
.summary-card.gpa .value { color: var(--primary); }
.summary-card.credits .value { color: #06B6D4; }
.summary-card.rank .value { color: #F59E0B; }

.grade-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.35s ease backwards;
}

.grade-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.grade-subject {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.3;
  color: var(--dark);
  letter-spacing: -0.2px;
}
.grade-teacher {
  font-size: 12px;
  color: var(--gray);
  margin-top: 3px;
  font-weight: 500;
}
.grade-badge {
  flex-shrink: 0;
  min-width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 16px;
}
.grade-A  { background: #D1FAE5; color: #065F46; }
.grade-A- { background: #D1FAE5; color: #065F46; }
.grade-B+ { background: #DBEAFE; color: #1E40AF; }
.grade-B  { background: #DBEAFE; color: #1E40AF; }

.grade-scores {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}
.score-item { text-align: center; }
.score-item .score-label {
  font-size: 10.5px; color: var(--gray);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.3px; margin-bottom: 3px;
}
.score-item .score-value {
  font-size: 15px; font-weight: 800; color: var(--dark);
}
.score-item.best .score-value { color: var(--success); }

.progress-bar {
  height: 5px;
  background: var(--gray-bg);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
}

/* ============================================================
   HOME
============================================================ */
.hero-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius);
  padding: 22px 20px;
  color: var(--white);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(200,16,46,0.25);
}
.hero-card::before {
  content: '';
  position: absolute;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  top: -80px; right: -60px;
}
.hero-card h2 {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 4px;
  letter-spacing: -0.3px;
  position: relative;
}
.hero-card p {
  font-size: 13px;
  opacity: 0.9;
  font-weight: 500;
  position: relative;
}

.section-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
  margin: 20px 0 12px;
  letter-spacing: -0.2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.quick-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.15s;
}
.quick-card:active { transform: scale(0.97); }
.quick-card .q-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  background: var(--primary-soft);
}
.quick-card .q-text .q-title {
  font-size: 14px; font-weight: 800; color: var(--dark);
}
.quick-card .q-text .q-sub {
  font-size: 12px; color: var(--gray); font-weight: 500;
}

/* ============================================================
   PROFILE
============================================================ */
.profile-hero {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius);
  padding: 24px 20px;
  text-align: center;
  color: var(--white);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(200,16,46,0.25);
}
.profile-hero::before {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  top: -100px; right: -60px;
}
.profile-avatar-lg {
  width: 84px; height: 84px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  font-size: 42px;
  margin: 0 auto 12px;
  border: 3px solid rgba(255,255,255,0.5);
  position: relative;
}
.profile-hero h2 {
  font-size: 19px; font-weight: 900;
  letter-spacing: -0.3px; margin-bottom: 3px;
  position: relative;
}
.profile-hero .group-info {
  font-size: 13px; opacity: 0.9;
  font-weight: 600; position: relative;
}

.form-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.form-row { margin-bottom: 14px; }
.form-row label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 800;
  color: var(--gray); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.form-row input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  background: #FAFAFA;
  transition: all 0.2s;
  color: var(--dark);
  font-weight: 600;
}
.form-row input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(200,16,46,0.1);
}

.success-msg {
  color: var(--success); font-size: 14px;
  font-weight: 700; margin-top: 12px;
  text-align: center; min-height: 20px;
}

/* ============================================================
   BOTTOM NAV
============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 6px 6px calc(6px + var(--safe-bottom));
  z-index: 90;
  max-width: 720px;
  margin: 0 auto;
}

.bottom-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 12px;
  color: var(--gray);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  transition: color 0.2s;
  position: relative;
}

.bottom-nav-item .nav-icon {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s;
}

.bottom-nav-item.active {
  color: var(--primary);
}
.bottom-nav-item.active .nav-icon {
  transform: translateY(-1px) scale(1.08);
}

/* ============================================================
   NOTIFICATION & TOAST
============================================================ */
.notification {
  margin-top: 16px;
  padding: 14px 16px;
  background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
  color: #065F46;
  border-left: 4px solid var(--success);
  border-radius: 12px;
  font-weight: 600;
  font-size: 13.5px;
  display: flex; align-items: flex-start; gap: 10px;
  animation: slideDown 0.4s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.hidden { display: none !important; }

.toast {
  position: fixed;
  bottom: calc(92px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(200px);
  background: var(--dark);
  color: var(--white);
  padding: 13px 22px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  z-index: 1000;
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  max-width: calc(100% - 32px);
  white-space: nowrap;
}

  }

  // Tab switch
  $$('.tab-pill').forEach(p => {
    p.addEventListener('click', function () {
      activeTab = this.dataset.tab;
      renderSchedule();
    });
  });

  /* ============================================================
     БАҒАЛАР
  ============================================================ */
  function renderGrades() {
    const gradePoint = { 'A': 4.0, 'A-': 3.67, 'B+': 3.33, 'B': 3.0, 'B-': 2.67, 'C+': 2.33 };
    let totalPoints = 0, totalCredits = 0;
    GRADES.forEach(g => {
      totalPoints += (gradePoint[g.total] || 0) * g.credits;
      totalCredits += g.credits;
    });
    const gpa = (totalPoints / totalCredits).toFixed(2);
    const avg = Math.round(GRADES.reduce((s, g) => s + (g.r1 + g.r2 + g.exam) / 3, 0) / GRADES.length);

    $('#gradesSummary').innerHTML = `
      <div class="summary-card gpa">
        <div class="icon">🎯</div>
        <div class="value">${gpa}</div>
        <div class="label">GPA</div>
      </div>
      <div class="summary-card credits">
        <div class="icon">📚</div>
        <div class="value">${totalCredits}</div>
        <div class="label">Кредит</div>
      </div>
      <div class="summary-card rank">
        <div class="icon">📈</div>
        <div class="value">${avg}</div>
        <div class="label">Орташа</div>
      </div>
    `;

    const list = $('#gradesList');
    list.innerHTML = '';
    GRADES.forEach((g, i) => {
      const avgScore = Math.round((g.r1 + g.r2 + g.exam) / 3);
      const badgeClass = 'grade-' + g.total.replace('+','\\+').replace('-','\\-');
      const card = document.createElement('div');
      card.className = 'grade-card';
      card.style.animationDelay = (i * 0.04) + 's';
      card.innerHTML = `
        <div class="grade-header">
          <div style="flex:1;min-width:0;">
            <div class="grade-subject">${g.subject}</div>
            <div class="grade-teacher">🎓 ${g.teacher}</div>
          </div>
          <div class="grade-badge ${badgeClass}">${g.total}</div>
        </div>
        <div class="grade-scores">
          <div class="score-item"><div class="score-label">1-РК</div><div class="score-value">${g.r1}</div></div>
          <div class="score-item"><div class="score-label">2-РК</div><div class="score-value">${g.r2}</div></div>
          <div class="score-item"><div class="score-label">Емтихан</div><div class="score-value">${g.exam}</div></div>
          <div class="score-item best"><div class="score-label">Орташа</div><div class="score-value">${avgScore}</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${avgScore}%"></div></div>
      `;
      list.appendChild(card);
    });

    setTimeout(() => {
      const n = $('#notification');
      n.innerHTML = '🔔 <div><b>Жаңа хабарлама:</b> Емтихан бағасы жарияланды — «Математикалық анализ»: <b>A</b></div>';
      n.classList.remove('hidden');
    }, 2000);
  }

  /* ============================================================
     БАСТЫ БЕТ
  ============================================================ */
  function renderHome() {
    const days = ['Жексенбі','Дүйсенбі','Сейсенбі','Сәрсенбі','Бейсенбі','Жұма','Сенбі'];
    const today = new Date().getDay();
    const hour = new Date().getHours();
    let greet = 'Қайырлы күн!';
    if (hour < 12) greet = 'Қайырлы таң!';
    else if (hour < 18) greet = 'Қайырлы күн!';
    else greet = 'Қайырлы кеш!';

    const profile = getProfileData();
    $('#heroGreeting').textContent = greet + ' 👋';
    $('#heroName').textContent = (profile.fullName || 'Студент') + ' • ' + (profile.group || '—');

    const todayKey = days[today] || 'Дүйсенбі';
    const todayLessons = SCHEDULE[todayKey] || [];
    $('#todayCount').textContent = todayLessons.length + ' сабақ';

    const preview = $('#todayPreview');
    preview.innerHTML = '';
    if (todayLessons.length === 0) {
      preview.innerHTML = `
        <div class="empty-state" style="padding:30px 20px;">
          <div class="icon" style="font-size:44px;">🎉</div>
          <p style="font-size:14px;">Бүгін сабақ жоқ</p>
        </div>`;
    } else {
      todayLessons.slice(0, 2).forEach((l, i) => preview.appendChild(buildLessonCard(l, i)));
    }
  }

  /* ============================================================
     ПРОФИЛЬ
  ============================================================ */
  const DEFAULT_PROFILE = {
    fullName: 'Асқар Нұрлан',
    email: 'askar@university.kz',
    phone: '+7 700 123 4567',
    group: 'IT-21'
  };

  function getProfileData() {
    try {
      const raw = safeGet('profile');
      if (raw) return Object.assign({}, DEFAULT_PROFILE, JSON.parse(raw));
    } catch (e) {}
    return Object.assign({}, DEFAULT_PROFILE);
  }

  function loadProfile() {
    const data = getProfileData();
    $('#fullName').value = data.fullName || '';
    $('#email').value = data.email || '';
    $('#phone').value = data.phone || '';
    $('#group').value = data.group || '';
    $('#heroName2').textContent = data.fullName || 'Студент';
    $('#heroGroup').textContent = 'Топ: ' + (data.group || '—');
  }

  $('#profileForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {
      fullName: $('#fullName').value.trim(),
      email: $('#email').value.trim(),
      phone: $('#phone').value.trim(),
      group: $('#group').value.trim()
    };
    safeSet('profile', JSON.stringify(data));
    $('#heroName2').textContent = data.fullName || 'Студент';
    $('#heroGroup').textContent = 'Топ: ' + (data.group || '—');
    renderHome();
    const msg = $('#saveMsg');
    msg.textContent = '✅ Мәліметтер сәтті сақталды!';
    showToast('Профиль жаңартылды ✅');
    setTimeout(() => { msg.textContent = ''; }, 2500);
  });

  /* ============================================================
     INIT
  ============================================================ */
  function renderAll() {
    renderSchedule();
    renderGrades();
    renderHome();
    loadProfile();
  }

  function init() {
    if (isLoggedIn()) showApp();
    else showLogin();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
